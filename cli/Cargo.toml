[package]
name = "nostradamus-cli"

[dependencies]
log = "0.4"
walkdir = "2.4.0"
geo-types = "0.7.11"
env_logger = "0.11"
serde_json = "1"
lazy_static = "1.4"
thiserror = "2"
itertools = "0.14"
map_3d = "0.1.5"
clap = { version = "4.4.13", features = ["derive", "color"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }

gnss-rs = { workspace = true }
hifitime = { workspace = true }
nostradamus-core = { workspace = true }
sp3 = { workspace = true, optional = true }
rinex = { workspace = true, optional = true }
anise = { workspace = true, features = ["embed-ephem"] }
